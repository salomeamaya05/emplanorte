# Entorno LOCAL aislado. No usa DATABASE_URL ni ninguna credencial de Supabase.
spring.datasource.url=jdbc:h2:file:./.local-data/emplanorte-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local-e2e.sql
spring.sql.init.separator=^^^

server.address=127.0.0.1
server.port=8080
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
app.auth.token-secret=${AUTH_TOKEN_SECRET:}
app.auth.token-duration-hours=24

# En local los soportes se guardan dentro de .local-data; jamás en Supabase.
supabase.url=
supabase.secret-key=
storage.local.enabled=true
storage.local.directory=./.local-data/facturas

# Cuenta fija, exclusivamente ficticia, que se crea o repara en cada arranque local.
app.local.admin.email=admin.local@emplanorte.test
app.local.admin.password=${LOCAL_ADMIN_PASSWORD:}

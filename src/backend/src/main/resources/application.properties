# Configuración del servidor
server.port=${PORT:8080}

# Conexión a PostgreSQL / Supabase
# En Render use exactamente: DATABASE_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/emplanorte_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Autenticación del API. Configure AUTH_TOKEN_SECRET con al menos 32 caracteres
# antes de desplegar para que las sesiones sobrevivan reinicios del backend.
app.auth.token-secret=${AUTH_TOKEN_SECRET:}
app.auth.token-duration-hours=${AUTH_TOKEN_DURATION_HOURS:24}

# Supabase Storage privado para soportes de facturas
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:facturas-proveedores}

# Archivos de factura (máximo 10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

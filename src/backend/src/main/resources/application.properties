# Configuración del servidor
server.port=${PORT:8080}

# Conexión a PostgreSQL
# En producción (Render) se definen DB_URL, DB_USER y DB_PASSWORD apuntando a Neon.
# La DB_URL de Neon debe incluir ?sslmode=require. En local se usan los defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/emplanorte_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
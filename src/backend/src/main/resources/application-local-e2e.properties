# Perfil aislado: solo se activa explícitamente para pruebas locales E2E.
spring.datasource.url=jdbc:h2:mem:emplanorte_e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-local-e2e.sql
spring.sql.init.separator=^^^
server.port=8080
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
app.auth.token-secret=EMPLANORTE_E2E_ONLY_TOKEN_SECRET_2026_DO_NOT_USE_IN_PRODUCTION
app.auth.token-duration-hours=24
supabase.url=
supabase.secret-key=
storage.local.enabled=true
storage.local.directory=./.local-data/facturas-e2e

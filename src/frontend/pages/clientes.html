<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPLANORTE - Clientes</title>
    <link rel="icon" type="image/png" href="../img/Logo.png">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos -->
    <link rel="stylesheet" href="../css/styles.css?v=2.4.0">
    <link rel="stylesheet" href="../css/app.css?v=2.4.0">
</head>
<body class="app-body">
    <div class="app-layout">
        <!-- Main Content -->
        <div class="main-content">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">Clientes</h1>
                <div class="page-actions">
                    <button class="btn-app btn-app-primary" id="btnAgregarCliente">
                        <span>＋</span> Agregar Cliente
                    </button>
                </div>
            </div>

            <!-- Page Body -->
            <div class="page-body">
                <!-- Summary Cards -->
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="card-icon icon-primary">👤</div>
                        <div class="card-info">
                            <div class="card-label">Total Clientes</div>
                            <div class="card-value" id="totalClientes">0</div>
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="card-icon icon-success">✅</div>
                        <div class="card-info">
                            <div class="card-label">Activos</div>
                            <div class="card-value" id="clientesActivos">0</div>
                        </div>
                    </div>
                </div>

                <!-- Filter Bar -->
                <div class="filter-bar">
                    <div class="search-input">
                        <input type="text" id="searchInput" placeholder="Buscar por nombre o teléfono...">
                    </div>
                </div>

                <!-- Data Table -->
                <div class="data-section">
                    <table class="data-table" id="tablaClientes">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Dirección</th>
                                <th>Observaciones</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientesBody">
                            <!-- Rows rendered by JS -->
                        </tbody>
                    </table>

                    <!-- Empty State -->
                    <div class="empty-state hidden" id="emptyState">
                        <div class="empty-icon">👤</div>
                        <div class="empty-title">No hay clientes registrados</div>
                        <div class="empty-desc">Agrega tu primer cliente haciendo clic en "Agregar Cliente".</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Agregar / Editar Cliente -->
    <div class="modal-overlay" id="modalCliente">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Agregar Cliente</h3>
                <button class="modal-close" id="btnCerrarModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="formCliente">
                    <input type="hidden" id="clienteId">

                    <div class="form-group-app">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" placeholder="Nombre completo del cliente" required>
                    </div>

                    <div class="form-group-app">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" placeholder="Ej: 3001234567">
                    </div>

                    <div class="form-group-app">
                        <label for="direccion">Dirección</label>
                        <textarea id="direccion" rows="2" placeholder="Dirección del cliente"></textarea>
                    </div>

                    <div class="form-group-app">
                        <label for="observaciones">Observaciones</label>
                        <textarea id="observaciones" rows="3" placeholder="Notas adicionales sobre el cliente"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-app btn-app-outline" id="btnCancelar">Cancelar</button>
                <button class="btn-app btn-app-primary" id="btnGuardar">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js?v=2.4.0"></script>
    <script src="../js/utils.js?v=2.4.0"></script>
    <script>
        // ---- State ----
        let clientes = [];
        let editingId = null;

        // ---- Init ----
        checkSession();
        renderSidebar('clientes');
        cargarClientes();

        // ---- DOM References ----
        const searchInput = document.getElementById('searchInput');
        const clientesBody = document.getElementById('clientesBody');
        const emptyState = document.getElementById('emptyState');
        const tablaClientes = document.getElementById('tablaClientes');
        const totalClientesEl = document.getElementById('totalClientes');
        const clientesActivosEl = document.getElementById('clientesActivos');
        const modalTitle = document.getElementById('modalTitle');
        const formCliente = document.getElementById('formCliente');
        const clienteIdInput = document.getElementById('clienteId');

        // ---- Event Listeners ----
        document.getElementById('btnAgregarCliente').addEventListener('click', abrirModalCrear);
        document.getElementById('btnCerrarModal').addEventListener('click', cerrarModal);
        document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
        document.getElementById('btnGuardar').addEventListener('click', guardarCliente);
        searchInput.addEventListener('input', filtrarClientes);

        // Close modal on overlay click
        document.getElementById('modalCliente').addEventListener('click', (e) => {
            if (e.target.id === 'modalCliente') cerrarModal();
        });

        // ---- Load Clients ----
        async function cargarClientes() {
            try {
                clientes = await ApiClient.listarClientes();
                actualizarResumen();
                filtrarClientes();
            } catch (error) {
                showToast('Error al cargar clientes: ' + error.message, 'error');
            }
        }

        // ---- Update Summary Cards ----
        function actualizarResumen() {
            totalClientesEl.textContent = clientes.length;
            const activos = clientes.filter(c => c.activo !== false).length;
            clientesActivosEl.textContent = activos;
        }

        // ---- Filter & Render ----
        function filtrarClientes() {
            const term = searchInput.value.toLowerCase().trim();
            let filtered = clientes;

            if (term) {
                filtered = clientes.filter(c => {
                    const nombre = (c.nombre || '').toLowerCase();
                    const telefono = (c.telefono || '').toLowerCase();
                    return nombre.includes(term) || telefono.includes(term);
                });
            }

            renderTabla(filtered);
        }

        function renderTabla(lista) {
            if (lista.length === 0) {
                tablaClientes.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            tablaClientes.classList.remove('hidden');
            emptyState.classList.add('hidden');

            clientesBody.innerHTML = lista.map(c => {
                const activo = c.activo !== false;
                const badgeClass = activo ? 'badge-success' : 'badge-danger';
                const badgeText = activo ? 'Activo' : 'Inactivo';

                return `
                    <tr>
                        <td style="font-weight:600; color:var(--text-dark);">${escapeHtml(c.nombre || '')}</td>
                        <td>${escapeHtml(c.telefono || '-')}</td>
                        <td>${escapeHtml(c.direccion || '-')}</td>
                        <td>${escapeHtml(c.observaciones || '-')}</td>
                        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                        <td>
                            <div style="display:flex; gap:6px;">
                                <button class="btn-app btn-app-outline btn-app-sm" onclick="abrirModalEditar(${c.id})">✏️ Editar</button>
                                <button class="btn-app btn-app-danger btn-app-sm" onclick="confirmarEliminar(${c.id}, '${escapeHtml(c.nombre || '')}')">🗑️ Eliminar</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ---- Modal: Create ----
        function abrirModalCrear() {
            editingId = null;
            modalTitle.textContent = 'Agregar Cliente';
            resetForm('formCliente');
            clienteIdInput.value = '';
            openModal('modalCliente');
        }

        // ---- Modal: Edit ----
        function abrirModalEditar(id) {
            const cliente = clientes.find(c => c.id === id);
            if (!cliente) return;

            editingId = id;
            modalTitle.textContent = 'Editar Cliente';
            clienteIdInput.value = id;
            document.getElementById('nombre').value = cliente.nombre || '';
            document.getElementById('telefono').value = cliente.telefono || '';
            document.getElementById('direccion').value = cliente.direccion || '';
            document.getElementById('observaciones').value = cliente.observaciones || '';
            openModal('modalCliente');
        }

        // ---- Close Modal ----
        function cerrarModal() {
            closeModal('modalCliente');
            editingId = null;
            resetForm('formCliente');
        }

        // ---- Save (Create / Update) ----
        async function guardarCliente() {
            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const observaciones = document.getElementById('observaciones').value.trim();

            if (!nombre) {
                showToast('El nombre del cliente es obligatorio.', 'warning');
                return;
            }

            const data = { nombre, telefono, direccion, observaciones };
            const btnGuardar = document.getElementById('btnGuardar');
            btnGuardar.disabled = true;
            btnGuardar.textContent = 'Guardando...';

            try {
                if (editingId) {
                    await ApiClient.actualizarCliente(editingId, data);
                    showToast('Cliente actualizado correctamente.', 'success');
                } else {
                    await ApiClient.crearCliente(data);
                    showToast('Cliente creado correctamente.', 'success');
                }
                cerrarModal();
                await cargarClientes();
            } catch (error) {
                showToast('Error al guardar cliente: ' + error.message, 'error');
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Guardar';
            }
        }

        // ---- Delete ----
        async function confirmarEliminar(id, nombre) {
            if (!confirm(`¿Estás seguro de eliminar al cliente "${nombre}"? Esta acción no se puede deshacer.`)) {
                return;
            }

            try {
                await ApiClient.eliminarCliente(id);
                showToast('Cliente eliminado correctamente.', 'success');
                await cargarClientes();
            } catch (error) {
                showToast('Error al eliminar cliente: ' + error.message, 'error');
            }
        }

        // ---- HTML Escape Utility ----
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
